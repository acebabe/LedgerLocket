version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ledgerlocket
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledgerpass
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: ./backend
    command: flask run --host=0.0.0.0 --port=5000
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://ledger:ledgerpass@db:5432/ledgerlocket
      - REDIS_URL=redis://redis:6379/0
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis

  worker:
    build: ./backend
    command: celery -A manage.celery worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://ledger:ledgerpass@db:5432/ledgerlocket
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  db-data:
