version: "3.8"
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledgerlocket
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

  web:
    build: .
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ledgerlocket
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: changeme
      JWT_SECRET_KEY: jwt-secret
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "5000:5000"
    command: flask run --host=0.0.0.0 --port=5000

  worker:
    build: .
    depends_on:
      - db
      - redis
    command: celery -A tasks.cel worker --loglevel=info

volumes:
  pgdata:
