openapi: 3.0.0
info:
  title: LedgerLocket API
  version: 0.1.0
paths:
  /auth/register:
    post:
      summary: Register a user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Created
  /transactions/{tx_ref}/screenshot.png:
    get:
      summary: Get receipt screenshot for transaction
      parameters:
        - name: tx_ref
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PNG image
          content:
            image/png: {}
